[project]
name = "mvsua-ticket-monitor"
version = "0.1.0"
description = "Read-only monitor for available practical exam slots in the Ukrainian MVS e-queue system."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "curl-cffi>=0.7.0",
    "playwright>=1.44.0",
]

[project.scripts]
mvsua-monitor = "mvsuabot.monitor:main"
mvsua-monitor-once = "mvsuabot.monitor:main_once"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["mvsuabot"]




